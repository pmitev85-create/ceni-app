<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Цени</title>
  <meta name="description" content="Любимите ми продукти и цените им по магазини">
  <meta name="theme-color" content="#1f6f43">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Цени</h1>
      <p id="info" class="muted">Зареждам…</p>
    </div>
    <button id="obnovi" class="icon-btn" title="Обнови данните" aria-label="Обнови данните">↻</button>
  </header>

  <main>
    <!-- 1. Любими -->
    <section id="tab-lyubimi" class="tab active" aria-label="Любими продукти">
      <div id="obobshtenie"></div>
      <div id="lyubimi"></div>
      <div class="kopie">
        <button id="iznesi" class="btn secondary small-btn">Запази копие</button>
        <button id="vnesi" class="btn secondary small-btn">Възстанови от копие</button>
      </div>
    </section>

    <!-- 2. Търсене -->
    <section id="tab-tarsi" class="tab" aria-label="Търсене">
      <input id="tarsi" class="search" type="search" placeholder="Напр. верея мляко, lavazza, сирене маджаров…" autocomplete="off">
      <div id="tarsi-rez"></div>
    </section>

    <!-- 3. Сканиране -->
    <section id="tab-skan" class="tab" aria-label="Сканиране на баркод">
      <div id="kamera-kutia" class="kamera hidden">
        <video id="video" playsinline muted></video>
        <div class="ramka"></div>
        <button id="spri" class="btn secondary">Спри камерата</button>
      </div>
      <button id="start-skan" class="btn big">📷 Сканирай баркод</button>
      <form id="raachno" class="row">
        <input id="barkod" type="text" inputmode="numeric" placeholder="или въведи баркода" autocomplete="off">
        <button class="btn secondary" type="submit">Търси</button>
      </form>
      <div id="skan-rez"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tabbtn active" data-tab="lyubimi" role="tab"><span>⭐</span>Любими</button>
    <button class="tabbtn" data-tab="tarsi" role="tab"><span>🔎</span>Търси</button>
    <button class="tabbtn" data-tab="skan" role="tab"><span>📷</span>Сканирай</button>
  </nav>

  <dialog id="sledi">
    <form method="dialog">
      <h2 id="s-zaglavie">Следи продукта</h2>
      <label>Име<input id="s-ime" required></label>
      <label>Думи, по които го търся във веригите
        <input id="s-dumi" required autocomplete="off">
      </label>
      <label class="check" id="s-razmer-red"><input type="checkbox" id="s-razmer"> <span id="s-razmer-tekst"></span></label>
      <div id="s-preglad" class="preglad"></div>
      <div class="row end">
        <button class="btn secondary" value="cancel" formnovalidate>Отказ</button>
        <button class="btn" value="ok">⭐ Запази</button>
      </div>
    </form>
  </dialog>

  <dialog id="istoria">
    <form method="dialog">
      <h2 id="ist-zaglavie">История</h2>
      <div id="ist-sadarzhanie"></div>
      <div class="row end"><button class="btn" value="ok">Затвори</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
