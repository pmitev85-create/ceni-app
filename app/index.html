<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Цени</title>
  <meta name="description" content="Сравнение на цени в Lidl, Kaufland, Metro и други вериги">
  <meta name="theme-color" content="#1f6f43">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Цени</h1>
      <p id="info" class="muted">Зареждам…</p>
    </div>
    <button id="obnovi" class="icon-btn" title="Обнови данните" aria-label="Обнови данните">↻</button>
  </header>

  <main>
    <!-- 1. Моят списък -->
    <section id="tab-spisak" class="tab active" aria-label="Моят списък">
      <div id="koshnica" class="card koshnica"></div>
      <input id="filtar" class="search" type="search" placeholder="Филтрирай списъка…" autocomplete="off">
      <div id="spisak"></div>
      <p class="muted center small">Натисни продукт, за да видиш всички вериги.</p>
    </section>

    <!-- 2. Търсене -->
    <section id="tab-tarsi" class="tab" aria-label="Търсене">
      <input id="tarsi" class="search" type="search" placeholder="Напр. олио, кашкавал, кафе lavazza…" autocomplete="off">
      <div id="tarsi-rez"></div>
    </section>

    <!-- 3. Сканиране -->
    <section id="tab-skan" class="tab" aria-label="Сканиране на баркод">
      <div id="kamera-kutia" class="kamera hidden">
        <video id="video" playsinline muted></video>
        <div class="ramka"></div>
        <button id="spri" class="btn secondary">Спри камерата</button>
      </div>
      <button id="start-skan" class="btn big">📷 Сканирай баркод</button>
      <form id="raachno" class="row">
        <input id="barkod" type="text" inputmode="numeric" placeholder="или въведи баркода" autocomplete="off">
        <button class="btn secondary" type="submit">Търси</button>
      </form>
      <div id="skan-rez"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tabbtn active" data-tab="spisak" role="tab"><span>🧺</span>Списък</button>
    <button class="tabbtn" data-tab="tarsi" role="tab"><span>🔎</span>Търси</button>
    <button class="tabbtn" data-tab="skan" role="tab"><span>📷</span>Сканирай</button>
  </nav>

  <dialog id="dobavi">
    <form method="dialog" id="dobavi-forma">
      <h2>Добави в списъка</h2>
      <label>Име в таблицата<input id="d-ime" required></label>
      <label>Думи за търсене<input id="d-dumi" required></label>
      <div class="row">
        <label>Количество<input id="d-kol" inputmode="decimal" value="1"></label>
        <label>Мярка
          <select id="d-merka"><option>кг</option><option>л</option><option>бр</option></select>
        </label>
      </div>
      <p class="muted small">Ще се отвори GitHub с попълнен формуляр. Натисни <b>Create</b> и до около минута продуктът е в списъка.</p>
      <div class="row end">
        <button class="btn secondary" value="cancel" formnovalidate>Отказ</button>
        <button class="btn" value="ok">Продължи</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
