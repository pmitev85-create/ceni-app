name: Обнови цените

on:
  schedule:
    # Всеки ден в 07:17 българско (зимно) време. КЗП публикува цените за предния ден малко след полунощ.
    - cron: "17 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ceni/spisak.csv"
      - "ceni/nastroiki.json"
      - "ceni/obnovi.py"
      - ".github/workflows/obnovi-ceni.yml"

permissions:
  contents: write

concurrency:
  group: obnovi-ceni
  cancel-in-progress: false

jobs:
  obnovi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ceni/requirements.txt

      - name: Инсталирай библиотеките
        run: pip install -r ceni/requirements.txt

      - name: Изтегли цените, направи таблицата и данните за приложението
        run: python ceni/obnovi.py

      - name: Запиши в хранилището
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ceni/ceni.xlsx app/data/ceni.json app/data/istoria
          if git diff --cached --quiet; then
            echo "Няма промяна."
            exit 0
          fi
          git commit -m "Цени: обновяване $(TZ=Europe/Sofia date +'%d.%m.%Y')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
