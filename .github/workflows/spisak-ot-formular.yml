name: Промени списъка от формуляр

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: obnovi-ceni
  cancel-in-progress: false

jobs:
  promeni:
    # само за формуляра „продукт“ и само ако го е пуснал собственикът на хранилището
    if: (startsWith(github.event.issue.title, 'Продукт:') || contains(github.event.issue.labels.*.name, 'продукт')) && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ceni/requirements.txt

      - name: Инсталирай библиотеките
        run: pip install -r ceni/requirements.txt

      - name: Промени списъка
        id: spisak
        run: python ceni/promeni_spisak.py

      - name: Обнови таблицата
        run: python ceni/obnovi.py

      - name: Запиши промените
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ceni/spisak.csv ceni/ceni.xlsx app/data/ceni.json app/data/istoria
          git diff --cached --quiet && exit 0
          git commit -m "Списък: промяна от формуляр #$ISSUE"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Отговори и затвори
        if: success()
        run: |
          {
            cat ceni/.otgovor.md
            echo
            if [ -s ceni/.rezultat.md ]; then
              echo
              echo "**Какво намерих:**"
              grep -F "„$(cat ceni/.ime.txt)“" ceni/.rezultat.md || true
            fi
            echo
            echo "📱 Приложението ще покаже новия продукт до 1–2 минути (дръпни ↻ горе вдясно)."
            echo "📥 [Excel таблицата](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/ceni/ceni.xlsx)"
          } > otgovor.md
          gh issue comment "$ISSUE" --body-file otgovor.md
          gh issue close "$ISSUE"

      - name: Кажи, ако нещо се е объркало
        if: failure()
        run: |
          if [ -s ceni/.otgovor.md ]; then MSG="$(cat ceni/.otgovor.md)"; else MSG="❌ Нещо се обърка при обновяването."; fi
          gh issue comment "$ISSUE" --body "$MSG

          Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
